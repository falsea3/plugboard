services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: shop
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d shop"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: relay
      MYSQL_USER: relay
      MYSQL_PASSWORD: relay
      MYSQL_DATABASE: shop
    ports: ["127.0.0.1:53306:3306"]
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urelay", "-prelay"]
      interval: 2s
      retries: 60

  postgres14:
    image: postgres:14-alpine
    profiles: [all]
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: shop
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d shop"]
      interval: 2s
      retries: 30

  mysql80:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    profiles: [all]
    environment:
      MYSQL_ROOT_PASSWORD: relay
      MYSQL_USER: relay
      MYSQL_PASSWORD: relay
      MYSQL_DATABASE: shop
    ports: ["127.0.0.1:53307:3306"]
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urelay", "-prelay"]
      interval: 2s
      retries: 60

  mariadb104:
    image: mariadb:10.4
    profiles: [all]
    environment: &mariadb-env
      MARIADB_ROOT_PASSWORD: relay
      MARIADB_USER: relay
      MARIADB_PASSWORD: relay
      MARIADB_DATABASE: shop
    ports: ["127.0.0.1:53310:3306"]
    volumes: &mariadb-seed
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck: &mariadb-health
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  mariadb106:
    image: mariadb:10.6
    profiles: [all]
    environment: *mariadb-env
    ports: ["127.0.0.1:53311:3306"]
    volumes: *mariadb-seed
    healthcheck: *mariadb-health

  mariadb114:
    image: mariadb:11.4
    profiles: [all]
    environment: *mariadb-env
    ports: ["127.0.0.1:53312:3306"]
    volumes: *mariadb-seed
    healthcheck: *mariadb-health

  bastion:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache openssh >/dev/null && ssh-keygen -A
      && (id relay >/dev/null 2>&1 || adduser -D relay) && echo relay:relay | chpasswd
      && sed -i -e 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' -e 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
      && exec /usr/sbin/sshd -D -e"
    ports: ["127.0.0.1:52222:22"]
    volumes:
      # Keep host keys across container re-creation, or Plugboard (rightly)
      # refuses the "changed" key.
      - bastion-keys:/etc/ssh
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 60

volumes:
  bastion-keys:
