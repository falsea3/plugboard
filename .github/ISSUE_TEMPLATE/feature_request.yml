name: Feature request
description: Suggest a new feature or an improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A concrete use case — "when I do X against my database, I need Y because Z" — is much easier to act on than "Relay DB should support X".

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What do you do today, what's painful about it, and what would "fixed" look like?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other database clients do it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and didn't find this one
          required: true
