name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check frontend
        run: npm run frontend:check
      - name: Test frontend
        run: npm run frontend:test
      - name: Build frontend
        run: npm run frontend:build

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l apps/desktop)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet Go
        run: go vet ./apps/desktop/...
      - name: Test Go (race detector)
        run: go test -race ./apps/desktop/...
      - name: Dead code
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.45.0 -test ./apps/desktop/...)"
          if [ -n "$out" ]; then
            echo "::error::Unreachable code — remove it or use it:"
            echo "$out"
            exit 1
          fi

  servers:
    # The same PostgreSQL, MySQL and SSH bastion as make db-up, for the tests
    # that need a real server: read-only enforcement, edits, SSH tunnels.
    name: Tests against PostgreSQL, MySQL and SSH
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Start the sample servers
        run: docker compose -f dev/docker-compose.yml up -d --wait
      - name: Test against them
        env:
          PLUGBOARD_TEST_PG: 127.0.0.1:55432
          PLUGBOARD_TEST_MYSQL: 127.0.0.1:53306
          PLUGBOARD_TEST_SSH: 127.0.0.1:52222
          PLUGBOARD_TEST_REDIS: 127.0.0.1:56379
          PLUGBOARD_TEST_CLICKHOUSE: 127.0.0.1:59000
        run: go test -race -count=1 ./apps/desktop/internal/db/...

  server-versions:
    # The other releases make db-up-all starts, for what one does differently
    # from another: MariaDB writes column defaults as SQL, 10.4 has no RENAME
    # COLUMN, older PostgreSQL catalogs…
    name: Tests against ${{ matrix.server }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: postgres14, var: PLUGBOARD_TEST_PG, port: 55433 }
          - { server: mysql80, var: PLUGBOARD_TEST_MYSQL, port: 53307 }
          - { server: mariadb104, var: PLUGBOARD_TEST_MYSQL, port: 53310 }
          - { server: mariadb106, var: PLUGBOARD_TEST_MYSQL, port: 53311 }
          - { server: mariadb114, var: PLUGBOARD_TEST_MYSQL, port: 53312 }
          - { server: valkey, var: PLUGBOARD_TEST_REDIS, port: 56380 }
          - { server: clickhouse248, var: PLUGBOARD_TEST_CLICKHOUSE, port: 59001 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Start ${{ matrix.server }}
        run: docker compose -f dev/docker-compose.yml --profile all up -d --wait ${{ matrix.server }}
      - name: Test against it
        run: env "${{ matrix.var }}=127.0.0.1:${{ matrix.port }}" go test -race -count=1 ./apps/desktop/internal/db/...

  go-cross-platform:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Vet Go
        run: go vet ./apps/desktop/...
      - name: Test Go
        if: ${{ !matrix.race }}
        run: go test ./apps/desktop/...
      - name: Test Go (race detector)
        if: ${{ matrix.race }}
        run: go test -race ./apps/desktop/...

  e2e:
    name: E2E (Playwright, WebKit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit
        working-directory: apps/desktop/frontend
        run: npx playwright install --with-deps webkit
      - name: Run the walkthrough
        run: npm run frontend:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/desktop/frontend/playwright-report
          retention-days: 3
          if-no-files-found: ignore
