name: Release

# Pushing a v* tag (make release) builds every platform, signs the files the
# in-app updater installs, and publishes the GitHub release with latest.json.
# See docs/RELEASING.md for the keys and variables this needs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  WAILS_VERSION: v2.16.0
  UPDATE_REPOSITORY: ${{ github.repository }}
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  prepare:
    # Fails in seconds, before five builds spend twenty minutes.
    name: Check the release can go out
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Notes in CHANGELOG.md
        run: python3 scripts/changelog.py notes "$GITHUB_REF_NAME" > /dev/null
      - name: Update signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_PUBLIC_KEY:-}" ] || [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::Set the UPDATE_PUBLIC_KEY variable and the UPDATE_SIGNING_KEY secret (docs/RELEASING.md): a build without them could never update itself."
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # One download per Mac architecture: a universal app is both builds
          # in one, twice the size for everyone.
          - os: macos-latest
            platform: darwin/arm64
            artifact: macos-arm64
            arch: arm64
          - os: macos-latest
            platform: darwin/amd64
            artifact: macos-amd64
            arch: amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
            arch: amd64
          - os: windows-11-arm
            platform: windows/arm64
            artifact: windows-arm64
            arch: arm64
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'

      - name: Install dmgbuild
        if: runner.os == 'macOS'
        run: pip install -r apps/desktop/build/darwin/requirements.txt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libfuse2

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Info.plist and the Windows file properties take the version from wails.json.
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/wails.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.info.productVersion = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Build
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          flags=(-platform "${{ matrix.platform }}")
          if [ "$RUNNER_OS" = Windows ]; then flags+=(-nsis); fi
          mod=github.com/relay-client/plugboard/apps/desktop/internal
          wails build "${flags[@]}" -ldflags "-X $mod/api.appVersion=$VERSION -X $mod/update.Repo=$UPDATE_REPOSITORY -X $mod/update.PublicKey=$UPDATE_PUBLIC_KEY"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release
          (cd "apps/desktop/build/bin" && ditto -c -k --keepParent "Plugboard.app" "$GITHUB_WORKSPACE/release/plugboard-darwin-${{ matrix.arch }}.app.zip")
          apps/desktop/build/darwin/make-dmg.sh "apps/desktop/build/bin/Plugboard.app" "release/plugboard-$VERSION-darwin-${{ matrix.arch }}.dmg" "Plugboard $VERSION"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem apps\desktop\build\bin\*installer.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build\bin" }
          Copy-Item $installer.FullName "release\plugboard-$env:VERSION-windows-${{ matrix.arch }}-installer.exe"
          Copy-Item apps\desktop\build\bin\plugboard.exe "release\plugboard-windows-${{ matrix.arch }}.exe"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p release AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp apps/desktop/build/bin/plugboard release/plugboard-linux-amd64
          cp apps/desktop/build/bin/plugboard AppDir/usr/bin/plugboard
          cp apps/desktop/build/appicon.png AppDir/usr/share/icons/hicolor/512x512/apps/plugboard.png
          cp apps/desktop/build/appicon.png AppDir/plugboard.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Plugboard' 'Exec=plugboard' 'Icon=plugboard' \
            'Categories=Development;Database;' 'Comment=Desktop database client' > AppDir/plugboard.desktop
          cp AppDir/plugboard.desktop AppDir/usr/share/applications/
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/plugboard" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/plugboard
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "release/plugboard-$VERSION-linux-amd64.AppImage"

      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            check="$(mktemp -d)"
            ditto -x -k "release/plugboard-darwin-${{ matrix.arch }}.app.zip" "$check"
            bin="$check/Plugboard.app/Contents/MacOS/plugboard"
            plist_version="$(plutil -extract CFBundleShortVersionString raw -o - "$check/Plugboard.app/Contents/Info.plist")"
            [ "$plist_version" = "$VERSION" ] || { echo "::error::Info.plist says $plist_version, not $VERSION"; exit 1; }
            # Exactly the architecture the download is named for.
            want="$([ "${{ matrix.arch }}" = amd64 ] && echo x86_64 || echo arm64)"
            archs="$(lipo -archs "$bin")"
            [ "$archs" = "$want" ] || { echo "::error::the build is for '$archs', not $want"; exit 1; }
            # The runner is Apple Silicon: the Intel build starts only under Rosetta.
            if [ "$want" != "$(uname -m)" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::No Rosetta on this runner: the $want build's architecture was checked, not run."
              exit 0
            fi
          else
            bin=release/plugboard-linux-amd64
            out="$("release/plugboard-$VERSION-linux-amd64.AppImage" --appimage-extract-and-run --version)"
            case "$out" in *"$VERSION"*) ;; *) echo "::error::the AppImage reports '$out', not $VERSION"; exit 1 ;; esac
          fi
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::the build reports '$out', not $VERSION"; exit 1 ;; esac

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A GUI-subsystem exe only writes to stdout when it is redirected to a file.
          $out = Join-Path $env:RUNNER_TEMP "version.txt"
          $p = Start-Process -FilePath "release\plugboard-windows-${{ matrix.arch }}.exe" -ArgumentList "--version" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "the build exited with $($p.ExitCode)" }
          $text = (Get-Content $out -Raw).Trim()
          Write-Host $text
          if ($text -notlike "*$env:VERSION*") { throw "the build reports '$text', not $env:VERSION" }

      - uses: actions/upload-artifact@v7
        with:
          name: plugboard-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/changelog.py notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Sign the files the updater installs
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is required to sign updates."
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          version="${GITHUB_REF_NAME#v}"
          for name in plugboard-darwin-arm64.app.zip plugboard-darwin-amd64.app.zip plugboard-windows-amd64.exe plugboard-windows-arm64.exe \
                      plugboard-linux-amd64 "plugboard-$version-linux-amd64.AppImage"; do
            # The trusted comment ties the signature to this version and file
            # (see internal/update.signedComment).
            minisign -S -s "$key" -t "plugboard v$version $name" -m "release/$name"
          done
          # The public key must verify what the private key signed, or no install could ever update.
          printf '%s\n' "untrusted comment: minisign public key" "$UPDATE_PUBLIC_KEY" > pub.key
          minisign -V -p pub.key -m release/plugboard-linux-amd64

      - name: Write latest.json and checksums
        run: |
          set -euo pipefail
          python3 scripts/make-latest-json.py --release-dir release --tag "$GITHUB_REF_NAME" \
            --repo "$UPDATE_REPOSITORY" --notes-file release-notes.md
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Plugboard ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Plugboard ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
