    <title>Plugboard</title>
    <script>
      (() => {
        const p = navigator.platform || navigator.userAgent || '';
        document.documentElement.dataset.platform = /Mac/i.test(p) ? 'darwin' : /Win/i.test(p) ? 'windows' : 'linux';
        let mode = 'system';
        try { mode = localStorage.getItem('plugboard.theme') || 'system'; } catch {}
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      html[data-theme="dark"] body { background: #0b0b0c; }
      html[data-theme="light"] body { background: #f4f4f6; }
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; transition: opacity 0.2s; }
      html[data-theme="dark"] #boot { background: #0b0b0c; color: #8a8a90; }
      html[data-theme="light"] #boot { background: #f4f4f6; color: #6b6b74; }
      #boot .mark { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot img { display: block; width: 64px; height: 64px; }
      #boot .ring { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: 0.7; animation: boot-spin 0.8s linear infinite; }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
